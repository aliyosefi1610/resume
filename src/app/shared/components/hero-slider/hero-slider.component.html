<section
  class="revolution-hero"
  [attr.style]="parallaxStyle()"
  (mouseenter)="isPaused.set(true)"
  (mousemove)="updateParallax($event)"
  (mouseleave)="resetParallax()"
>
  @for (slide of slides(); track slide.title; let index = $index) {
    <article class="slide" [class.active]="activeIndex() === index" [class.align-end]="slide.align === 'end'">
      <div class="image-plane">
        <img [src]="slide.image" [alt]="slide.title">
      </div>
      <div class="slide-shade"></div>
      <div class="motion-light"></div>
      <div class="scan-lines"></div>

      <div class="container slide-content">
        <div class="copy-block">
          <span class="eyebrow">{{ slide.eyebrow }}</span>
          <h2 style="font-size: 24px">{{ slide.title }}</h2>
          <p>{{ slide.description }}</p>

          <div class="slider-actions">
            <a class="btn primary" [href]="primaryHref(index)">{{ slide.primaryLabel }}</a>
            <a class="btn" [href]="secondaryHref(index)" [attr.download]="isDownload(index) ? '' : null">
              {{ slide.secondaryLabel }}
            </a>
          </div>
        </div>
      </div>
    </article>
  }

  <div class="slider-controls" aria-label="Hero slider controls">
    <button type="button" (click)="previous()" aria-label="Previous slide">&lsaquo;</button>
    <div class="dots">
      @for (slide of slides(); track slide.title; let index = $index) {
        <button
          type="button"
          [class.active]="activeIndex() === index"
          (click)="goTo(index)"
          [attr.aria-label]="'Go to slide ' + (index + 1)"
        ></button>
      }
    </div>
    <button type="button" (click)="next()" aria-label="Next slide">&rsaquo;</button>
  </div>
</section>
